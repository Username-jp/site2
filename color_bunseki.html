<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>高精度・色彩分析ジェネレーター</title>
    <!-- Three.js (3D描画用ライブラリ) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <style>
        body {
            font-family: sans-serif;
            background-color: #bcbcbc;
            color: #111;
            margin: 0;
            padding: 20px;
        }

        .controls-panel {
            background: #ffffff;
            padding: 15px;
            border-radius: 6px;
            margin-bottom: 20px;
            display: flex;
            gap: 20px;
            align-items: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .control-group {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
            font-weight: bold;
        }

        .analysis-container {
            display: grid;
            grid-template-columns: 320px 320px 320px;
            gap: 20px;
            align-items: center;
            background: #bcbcbc;
            padding: 20px;
        }

        .preview-box img {
            width: 100%;
            height: auto;
            border: 1px solid #777;
            display: block;
        }

        .canvas-wrapper {
            position: relative;
            width: 320px;
            height: 320px;
            background: #bcbcbc;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        canvas {
            display: block;
        }

        #threedCanvas {
            width: 320px;
            height: 320px;
        }
    </style>
</head>
<body>

    <div class="controls-panel">
        <div class="control-group">
            <label>画像選択:</label>
            <input type="file" id="imageInput" accept="image/*">
        </div>
        <div class="control-group">
            <label>色彩空間:</label>
            <select id="colorSpaceSelect">
                <option value="hsv">HSV (色相・彩度・明度)</option>
                <option value="lab">CIELAB (知覚均一色彩空間)</option>
            </select>
        </div>
        <div class="control-group">
            <label>クラスタ数 (色数):</label>
            <input type="range" id="kClusterRange" min="10" max="60" value="35">
            <span id="kClusterVal">35</span>
        </div>
    </div>

    <div class="analysis-container">
        <!-- 1. アップロード画像プレビュー -->
        <div class="preview-box">
            <img id="imgPreview" src="" alt="画像プレビュー" style="display:none;">
        </div>

        <!-- 2. 2D 色相・彩度マップ -->
        <div class="canvas-wrapper">
            <canvas id="wheelCanvas" width="320" height="320"></canvas>
        </div>

        <!-- 3. 3D 色彩空間ビジュアル -->
        <div class="canvas-wrapper">
            <canvas id="threedCanvas"></canvas>
        </div>
    </div>

    <!-- 非表示解析用キャンバス -->
    <canvas id="hiddenCanvas" style="display:none;"></canvas>

    <script>
        const imageInput = document.getElementById('imageInput');
        const imgPreview = document.getElementById('imgPreview');
        const hiddenCanvas = document.getElementById('hiddenCanvas');
        const hCtx = hiddenCanvas.getContext('2d');

        const wheelCanvas = document.getElementById('wheelCanvas');
        const wCtx = wheelCanvas.getContext('2d');

        const colorSpaceSelect = document.getElementById('colorSpaceSelect');
        const kClusterRange = document.getElementById('kClusterRange');
        const kClusterVal = document.getElementById('kClusterVal');

        let currentImage = null;

        // --- Three.js 3D セットアップ ---
        const threedCanvas = document.getElementById('threedCanvas');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0xbcbcbc);

        const camera = new THREE.PerspectiveCamera(45, 1, 0.1, 1000);
        camera.position.set(0, 160, 260);

        const renderer = new THREE.WebGLRenderer({ canvas: threedCanvas, antialias: true });
        renderer.setSize(320, 320);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;

        let pointsGroup = new THREE.Group();
        let bgGuideGroup = new THREE.Group();
        scene.add(pointsGroup);
        scene.add(bgGuideGroup);

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
        animate();

        // --- イベントリスナー ---
        kClusterRange.addEventListener('input', (e) => {
            kClusterVal.textContent = e.target.value;
            if (currentImage) runAnalysis();
        });

        colorSpaceSelect.addEventListener('change', () => {
            if (currentImage) runAnalysis();
        });

        imageInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = (event) => {
                imgPreview.src = event.target.result;
                imgPreview.style.display = 'block';

                const img = new Image();
                img.onload = () => {
                    currentImage = img;
                    runAnalysis();
                };
                img.src = event.target.result;
            };
            reader.readAsDataURL(file);
        });

        function runAnalysis() {
            if (!currentImage) return;

            // 解析用縮小描画（速度維持）
            const sampleWidth = 100;
            const sampleHeight = Math.round((currentImage.height / currentImage.width) * sampleWidth);
            hiddenCanvas.width = sampleWidth;
            hiddenCanvas.height = sampleHeight;

            hCtx.drawImage(currentImage, 0, 0, sampleWidth, sampleHeight);
            const imgData = hCtx.getImageData(0, 0, sampleWidth, sampleHeight).data;

            // 1. ピクセルデータの抽出
            const pixels = [];
            for (let i = 0; i < imgData.length; i += 4) {
                if (imgData[i + 3] > 128) {
                    pixels.push([imgData[i], imgData[i + 1], imgData[i + 2]]);
                }
            }

            // 2. k-means クラスタリングの実行
            const k = parseInt(kClusterRange.value, 10);
            const clusters = kMeans(pixels, k, 8);

            // 3. 描画
            const mode = colorSpaceSelect.value;
            draw2DWheel(clusters, mode);
            draw3DSpace(clusters, mode);
        }

        // --- k-means アルゴリズム ---
        function kMeans(pixels, k, maxIter = 8) {
            // 初期化: ランダムにk個選択
            let centroids = [];
            for (let i = 0; i < k; i++) {
                centroids.push(pixels[Math.floor(Math.random() * pixels.length)]);
            }

            let assignments = new Array(pixels.length);
            let clusterCounts = new Array(k).fill(0);

            for (let iter = 0; iter < maxIter; iter++) {
                clusterCounts.fill(0);

                // 各ピクセルを最も近いセントロイドに割り当て
                for (let i = 0; i < pixels.length; i++) {
                    const p = pixels[i];
                    let minDist = Infinity;
                    let closest = 0;
                    for (let c = 0; c < k; c++) {
                        const cent = centroids[c];
                        const dist = (p[0] - cent[0]) ** 2 + (p[1] - cent[1]) ** 2 + (p[2] - cent[2]) ** 2;
                        if (dist < minDist) {
                            minDist = dist;
                            closest = c;
                        }
                    }
                    assignments[i] = closest;
                    clusterCounts[closest]++;
                }

                // セントロイドの再計算
                const newCentroids = Array.from({ length: k }, () => [0, 0, 0]);
                const counts = new Array(k).fill(0);

                for (let i = 0; i < pixels.length; i++) {
                    const cluster = assignments[i];
                    newCentroids[cluster][0] += pixels[i][0];
                    newCentroids[cluster][1] += pixels[i][1];
                    newCentroids[cluster][2] += pixels[i][2];
                    counts[cluster]++;
                }

                for (let c = 0; c < k; c++) {
                    if (counts[c] > 0) {
                        centroids[c] = [
                            Math.round(newCentroids[c][0] / counts[c]),
                            Math.round(newCentroids[c][1] / counts[c]),
                            Math.round(newCentroids[c][2] / counts[c])
                        ];
                    }
                }
            }

            // 結果のまとめ（RGB、出現割合、各空間の座標）
            return centroids.map((c, idx) => {
                const ratio = clusterCounts[idx] / pixels.length;
                const hsv = rgbToHsv(c[0], c[1], c[2]);
                const lab = rgbToLab(c[0], c[1], c[2]);
                return {
                    rgb: c,
                    ratio: ratio,
                    hsv: hsv,
                    lab: lab
                };
            }).filter(item => item.ratio > 0);
        }

        // --- 2D 色相環・座標グラフ描画 ---
        function draw2DWheel(clusters, mode) {
            const width = wheelCanvas.width;
            const height = wheelCanvas.height;
            const centerX = width / 2;
            const centerY = height / 2;
            const maxRadius = width / 2 - 25;

            wCtx.clearRect(0, 0, width, height);

            // 背景ガイド（参考画像スタイルの目盛り・軸線）
            wCtx.strokeStyle = "rgba(0, 0, 0, 0.25)";
            wCtx.lineWidth = 1;

            // 放射状の軸線 (8方向)
            for (let a = 0; a < 360; a += 45) {
                const rad = a * Math.PI / 180;
                wCtx.beginPath();
                wCtx.moveTo(centerX, centerY);
                wCtx.lineTo(centerX + maxRadius * Math.cos(rad), centerY + maxRadius * Math.sin(rad));
                wCtx.stroke();
            }

            // 同心円ガイド (3重)
            for (let r = 0.33; r <= 1.0; r += 0.33) {
                wCtx.beginPath();
                wCtx.arc(centerX, centerY, maxRadius * r, 0, Math.PI * 2);
                wCtx.stroke();
            }

            // 外周カラードットガイド
            for (let a = 0; a < 360; a += 15) {
                const rad = a * Math.PI / 180;
                const gx = centerX + (maxRadius + 10) * Math.cos(rad);
                const gy = centerY + (maxRadius + 10) * Math.sin(rad);
                const hsvRgb = hsvToRgb(a, 100, 100);
                wCtx.beginPath();
                wCtx.arc(gx, gy, 2, 0, Math.PI * 2);
                wCtx.fillStyle = `rgb(${hsvRgb[0]}, ${hsvRgb[1]}, ${hsvRgb[2]})`;
                wCtx.fill();
            }

            // クラスタプロットの描画（大きい順に描画して重なりを綺麗に表現）
            const sorted = [...clusters].sort((a, b) => b.ratio - a.ratio);

            sorted.forEach(item => {
                let x, y;
                if (mode === 'hsv') {
                    const angle = item.hsv.h * (Math.PI / 180);
                    const radius = (item.hsv.s / 100) * maxRadius;
                    x = centerX + radius * Math.cos(angle);
                    y = centerY + radius * Math.sin(angle);
                } else {
                    // LAB モード (a* = X軸, b* = Y軸)
                    x = centerX + (item.lab.a / 128) * maxRadius;
                    y = centerY - (item.lab.b / 128) * maxRadius;
                }

                // **3倍サイズ化**: 出現割合に応じて半径 12px 〜 36px 程度にスケール
                const radiusPx = 12 + Math.sqrt(item.ratio) * 45;

                wCtx.beginPath();
                wCtx.arc(x, y, radiusPx, 0, Math.PI * 2);
                wCtx.fillStyle = `rgba(${item.rgb[0]}, ${item.rgb[1]}, ${item.rgb[2]}, 0.85)`;
                wCtx.fill();
            });
        }

        // --- 3D 空間ビジュアル描画 ---
        function draw3DSpace(clusters, mode) {
            scene.remove(pointsGroup);
            scene.remove(bgGuideGroup);

            pointsGroup = new THREE.Group();
            bgGuideGroup = new THREE.Group();

            const maxRadius = 90;
            const heightScale = 140;

            // 3D背景ガイド（中央明度軸＋ドット）
            const axisGeo = new THREE.BufferGeometry().setFromPoints([
                new THREE.Vector3(0, -heightScale/2 - 10, 0),
                new THREE.Vector3(0, heightScale/2 + 10, 0)
            ]);
            const axisMat = new THREE.LineBasicMaterial({ color: 0x444444, linewidth: 1 });
            bgGuideGroup.add(new THREE.Line(axisGeo, axisMat));

            // 3D空間内のグリッド点ガイド
            for (let yDeg = -60; yDeg <= 60; yDeg += 30) {
                for (let a = 0; a < 360; a += 30) {
                    const rad = a * Math.PI / 180;
                    const gx = maxRadius * Math.cos(rad);
                    const gz = maxRadius * Math.sin(rad);
                    const pGeo = new THREE.SphereGeometry(0.8, 4, 4);
                    const pMat = new THREE.MeshBasicMaterial({ color: 0x666666 });
                    const pMesh = new THREE.Mesh(pGeo, pMat);
                    pMesh.position.set(gx, yDeg, gz);
                    bgGuideGroup.add(pMesh);
                }
            }
            scene.add(bgGuideGroup);

            // 各クラスタの3Dプロット
            clusters.forEach(item => {
                let x, y, z;

                if (mode === 'hsv') {
                    const angle = item.hsv.h * (Math.PI / 180);
                    const radius = (item.hsv.s / 100) * maxRadius;
                    x = radius * Math.cos(angle);
                    z = radius * Math.sin(angle);
                    y = (item.hsv.v / 100) * heightScale - (heightScale / 2);
                } else {
                    // LAB モード
                    x = (item.lab.a / 128) * maxRadius;
                    z = (item.lab.b / 128) * maxRadius;
                    y = (item.lab.L / 100) * heightScale - (heightScale / 2);
                }

                // **3倍サイズ化**: 球体半径を大幅拡大 (6px 〜 22px 程度)
                const sphereRadius = 6 + Math.sqrt(item.ratio) * 28;

                const geometry = new THREE.SphereGeometry(sphereRadius, 24, 24);
                const material = new THREE.MeshBasicMaterial({
                    color: new THREE.Color(`rgb(${item.rgb[0]}, ${item.rgb[1]}, ${item.rgb[2]})`),
                    transparent: true,
                    opacity: 0.9
                });

                const sphere = new THREE.Mesh(geometry, material);
                sphere.position.set(x, y, z);
                pointsGroup.add(sphere);
            });

            scene.add(pointsGroup);
        }

        // --- 色彩変換関数 (RGB <-> HSV / LAB) ---
        function rgbToHsv(r, g, b) {
            r /= 255; g /= 255; b /= 255;
            const max = Math.max(r, g, b), min = Math.min(r, g, b);
            let h, s, v = max;
            const d = max - min;
            s = max === 0 ? 0 : d / max;

            if (max === min) {
                h = 0;
            } else {
                switch (max) {
                    case r: h = (g - b) / d + (g < b ? 6 : 0); break;
                    case g: h = (b - r) / d + 2; break;
                    case b: h = (r - g) / d + 4; break;
                }
                h /= 6;
            }
            return { h: h * 360, s: s * 100, v: v * 100 };
        }

        function hsvToRgb(h, s, v) {
            s /= 100; v /= 100;
            let c = v * s;
            let x = c * (1 - Math.abs((h / 60) % 2 - 1));
            let m = v - c;
            let r=0, g=0, b=0;

            if (0 <= h && h < 60) { r=c; g=x; b=0; }
            else if (60 <= h && h < 120) { r=x; g=c; b=0; }
            else if (120 <= h && h < 180) { r=0; g=c; b=x; }
            else if (180 <= h && h < 240) { r=0; g=x; b=c; }
            else if (240 <= h && h < 300) { r=x; g=0; b=c; }
            else if (300 <= h && h < 360) { r=c; g=0; b=x; }

            return [Math.round((r+m)*255), Math.round((g+m)*255), Math.round((b+m)*255)];
        }

        function rgbToLab(r, g, b) {
            // RGB -> XYZ
            let rL = r / 255, gL = g / 255, bL = b / 255;
            rL = (rL > 0.04045) ? Math.pow((rL + 0.055) / 1.055, 2.4) : rL / 12.92;
            gL = (gL > 0.04045) ? Math.pow((gL + 0.055) / 1.055, 2.4) : gL / 12.92;
            bL = (bL > 0.04045) ? Math.pow((bL + 0.055) / 1.055, 2.4) : bL / 12.92;

            let x = (rL * 0.4124 + gL * 0.3576 + bL * 0.1805) / 0.95047;
            let y = (rL * 0.2126 + gL * 0.7152 + bL * 0.0722) / 1.00000;
            let z = (rL * 0.0193 + gL * 0.1192 + bL * 0.9505) / 1.08883;

            const f = t => (t > 0.008856) ? Math.pow(t, 1/3) : (7.787 * t) + (16 / 116);

            let fx = f(x), fy = f(y), fz = f(z);

            return {
                L: (116 * fy) - 16,
                a: 500 * (fx - fy),
                b: 200 * (fy - fz)
            };
        }
    </script>
</body>
</html>
