<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>画像色彩分析ツール</title>
    <!-- Three.js (3D描画用ライブラリ) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <style>
        body {
            font-family: sans-serif;
            background-color: #bbbbbb;
            color: #111;
            margin: 0;
            padding: 20px;
        }

        .upload-section {
            margin-bottom: 20px;
            background: #fff;
            padding: 15px;
            border-radius: 6px;
        }

        .analysis-container {
            display: grid;
            grid-template-columns: 300px 320px 320px;
            gap: 20px;
            align-items: center;
            background: #a9a9a9;
            padding: 20px;
            border-radius: 8px;
        }

        .preview-box img {
            width: 100%;
            height: auto;
            border: 1px solid #666;
            display: block;
        }

        .canvas-container {
            position: relative;
            width: 300px;
            height: 300px;
            background: #e0e0e0;
            border-radius: 50%;
            border: 1px solid #888;
        }

        canvas {
            display: block;
        }

        #threedCanvas {
            width: 300px;
            height: 300px;
            background: #e0e0e0;
            border-radius: 8px;
        }
    </style>
</head>
<body>

    <h2>画像色彩分析ジェネレーター</h2>

    <div class="upload-section">
        <input type="file" id="imageInput" accept="image/*">
    </div>

    <div class="analysis-container">
        <!-- 1. アップロード画像プレビュー -->
        <div class="preview-box">
            <img id="imgPreview" src="" alt="画像プレビュー" style="display:none;">
        </div>

        <!-- 2. 2D 色相・彩度マップ -->
        <div class="canvas-container">
            <canvas id="wheelCanvas" width="300" height="300"></canvas>
        </div>

        <!-- 3. 3D 色彩空間ビジュアル -->
        <div id="threedContainer">
            <canvas id="threedCanvas"></canvas>
        </div>
    </div>

    <!-- 画像ピクセル解析用非表示キャンバス -->
    <canvas id="hiddenCanvas" style="display:none;"></canvas>

    <script>
        const imageInput = document.getElementById('imageInput');
        const imgPreview = document.getElementById('imgPreview');
        const hiddenCanvas = document.getElementById('hiddenCanvas');
        const hCtx = hiddenCanvas.getContext('2d');

        const wheelCanvas = document.getElementById('wheelCanvas');
        const wCtx = wheelCanvas.getContext('2d');

        // Three.js 3Dセットアップ
        const threedCanvas = document.getElementById('threedCanvas');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0xe0e0e0);

        const camera = new THREE.PerspectiveCamera(45, 1, 0.1, 1000);
        camera.position.set(0, 150, 300);

        const renderer = new THREE.WebGLRenderer({ canvas: threedCanvas, antialias: true });
        renderer.setSize(300, 300);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;

        let pointsGroup = new THREE.Group();
        scene.add(pointsGroup);

        // 3Dアニメーションループ
        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
        animate();

        // 画像選択時の処理
        imageInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = (event) => {
                imgPreview.src = event.target.result;
                imgPreview.style.display = 'block';

                const img = new Image();
                img.onload = () => analyzeColor(img);
                img.src = event.target.result;
            };
            reader.readAsDataURL(file);
        });

        // 色解析・描画関数
        function analyzeColor(img) {
            // 画像を間引いて処理を軽量化（100x100程度にリサイズして抽出）
            const sampleWidth = 80;
            const sampleHeight = Math.round((img.height / img.width) * sampleWidth);
            hiddenCanvas.width = sampleWidth;
            hiddenCanvas.height = sampleHeight;

            hCtx.drawImage(img, 0, 0, sampleWidth, sampleHeight);
            const imgData = hCtx.getImageData(0, 0, sampleWidth, sampleHeight).data;

            // 色サンプルの抽出
            const colorSamples = [];
            for (let i = 0; i < imgData.length; i += 4) {
                const r = imgData[i];
                const g = imgData[i + 1];
                const b = imgData[i + 2];
                const a = imgData[i + 3];

                if (a > 128) {
                    const hsv = rgbToHsv(r, g, b);
                    colorSamples.push({ r, g, b, h: hsv.h, s: hsv.s, v: hsv.v });
                }
            }

            draw2DWheel(colorSamples);
            draw3DSpace(colorSamples);
        }

        // 2D 色相環描画
        function draw2DWheel(samples) {
            const width = wheelCanvas.width;
            const height = wheelCanvas.height;
            const centerX = width / 2;
            const centerY = height / 2;
            const maxRadius = width / 2 - 20;

            wCtx.clearRect(0, 0, width, height);

            // ガイド線描画
            wCtx.strokeStyle = "rgba(0,0,0,0.15)";
            wCtx.lineWidth = 1;
            for (let r = 0.25; r <= 1; r += 0.25) {
                wCtx.beginPath();
                wCtx.arc(centerX, centerY, maxRadius * r, 0, Math.PI * 2);
                wCtx.stroke();
            }

            // 色プロット
            samples.forEach(color => {
                const angle = color.h * (Math.PI / 180);
                const radius = (color.s / 100) * maxRadius;

                const x = centerX + radius * Math.cos(angle);
                const y = centerY + radius * Math.sin(angle);

                wCtx.beginPath();
                wCtx.arc(x, y, 4, 0, Math.PI * 2);
                wCtx.fillStyle = `rgba(${color.r}, ${color.g}, ${color.b}, 0.6)`;
                wCtx.fill();
            });
        }

        // 3D 空間描画（HSV空間柱体表現）
        function draw3DSpace(samples) {
            // 既存オブジェクトの破棄
            scene.remove(pointsGroup);
            pointsGroup = new THREE.Group();

            const maxRadius = 80;
            const heightScale = 120;

            samples.forEach(color => {
                const angle = color.h * (Math.PI / 180);
                const radius = (color.s / 100) * maxRadius;

                // 円柱座標から3D空間へ変換
                const x = radius * Math.cos(angle);
                const z = radius * Math.sin(angle);
                const y = (color.v / 100) * heightScale - (heightScale / 2);

                const geometry = new THREE.SphereGeometry(2.5, 8, 8);
                const material = new THREE.MeshBasicMaterial({
                    color: new THREE.Color(`rgb(${color.r}, ${color.g}, ${color.b})`),
                    transparent: true,
                    opacity: 0.7
                });

                const sphere = new THREE.Mesh(geometry, material);
                sphere.position.set(x, y, z);
                pointsGroup.add(sphere);
            });

            scene.add(pointsGroup);
        }

        // RGB -> HSV 変換ヘルパー
        function rgbToHsv(r, g, b) {
            r /= 255; g /= 255; b /= 255;
            const max = Math.max(r, g, b), min = Math.min(r, g, b);
            let h, s, v = max;
            const d = max - min;
            s = max === 0 ? 0 : d / max;

            if (max === min) {
                h = 0;
            } else {
                switch (max) {
                    case r: h = (g - b) / d + (g < b ? 6 : 0); break;
                    case g: h = (b - r) / d + 2; break;
                    case b: h = (r - g) / d + 4; break;
                }
                h /= 6;
            }
            return { h: h * 360, s: s * 100, v: v * 100 };
        }
    </script>
</body>
</html>
