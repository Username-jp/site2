<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>レイアウト調整サンプル</title>
    <style>
        body {
            font-family: sans-serif;
            padding: 20px;
            background-color: #f4f4f4;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .content-box {
            background: #ffffff;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #ddd;
        }

        /* コンテンツ1内のバナー画像スタイル */
        .banner-img {
            width: 200px;
            height: 40px;
            object-fit: cover;
            display: block;
            margin-top: 10px;
            border: 1px solid #ccc;
        }

        /* コンテンツ2の下に置くランダム画像エリア */
        .random-image-area {
            background: #ffffff;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #ddd;
            text-align: center;
        }

        .random-img {
            max-width: 100%;
            height: auto;
            border-radius: 4px;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- コンテンツ 1 -->
        <div class="content-box" id="content1">
            <h2>コンテンツ 1</h2>
            <p>ここがコンテンツ1のエリアです。</p>
            
            <!-- 幅200px × 高さ40px のバナー画像 -->
            <!-- src属性は実際のバナー画像のURLに変更してください -->
            <img src="https://picsum.photos/200/40" alt="nekonome.png" class="banner-img">
        </div>

        <!-- コンテンツ 2 -->
        <div class="content-box" id="content2">
            <h2>コンテンツ 2</h2>
            <p>ここがコンテンツ2のエリアです。</p>
        </div>

        <!-- コンテンツ2の下：ランダム画像配置エリア -->
        <div class="random-image-area" id="randomImageContainer">
            <h3>ランダム画像エリア</h3>
            <img id="randomImg" src="" alt="ランダム画像" class="random-img">
        </div>
    </div>

    <script>
        // ランダム画像を生成してコンテンツ2の下のエリアに読み込む処理
        function loadRandomImage() {
            const imgElement = document.getElementById('randomImg');
            // 呼び出すたびにキャッシュを回避してランダム画像を取得
            const randomId = Math.floor(Math.random() * 1000);
            imgElement.src = `https://picsum.photos/400/200?random=${randomId}`;
        }

        // ページ読み込み時に実行
        window.addEventListener('DOMContentLoaded', loadRandomImage);
    </script>

</body>
</html>
