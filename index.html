<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>chanmana.com</title>
    <style>
        /* 90年代レトロWebスタイルの全体設定 */
        body {
            background-color: #5bb3f0; /* スカイブルー背景 */
            color: #000000;
            font-family: "Times New Roman", Times, serif;
            margin: 0;
            padding: 10px;
        }

        a {
            color: #0000ee;
            text-decoration: underline;
        }
        a:visited {
            color: #551a8b;
        }

        /* ヘッダーエリア */
        header {
            text-align: center;
            margin-bottom: 10px;
        }
        header h1 {
            font-size: 32px;
            font-weight: bold;
            margin: 0 0 5px 0;
        }

        /* 外枠フレーム（全体を囲む黒枠） */
        .site-container {
            display: flex;
            background-color: #ffffff;
            border: 2px solid #000000;
            min-height: 500px;
        }

        /* 左側フレーム風サイドバー */
        .sidebar {
            width: 220px;
            border-right: 2px solid #000000;
            padding: 10px;
            box-sizing: border-box;
            flex-shrink: 0;
        }

        .sidebar-window {
            margin-bottom: 20px;
        }

        .sidebar-window h3 {
            font-size: 14px;
            margin: 0 0 8px 0;
            border-bottom: 1px solid #000;
            padding-bottom: 2px;
        }

        /* 右側メインエリア */
        .main-content {
            flex: 1;
            padding: 15px 20px;
            box-sizing: border-box;
        }

        /* ランダム画像エリア（高さ最大200px・比率維持・切り取りなし） */
        .random-box {
            background: #ffffff;
            border: 1px solid #808080;
            padding: 2px;
            margin-top: 6px;
            text-align: center;
            overflow: hidden;
            max-height: 200px;
            width: 100%;
        }

        .random-box img {
            width: auto;
            max-width: 100%;
            height: auto;
            max-height: 200px;
            display: block;
            margin: 0 auto;
            object-fit: contain;
            border: none;
        }

        /* フッターエリア */
        footer {
            margin-top: 10px;
            font-size: 12px;
            color: #000000;
        }
    </style>
</head>
<body>

    <!-- ヘッダー -->
    <header>
        <h1>chanmana.com</h1>
    </header>

    <!-- メインフレーム構造 -->
    <div class="site-container">

        <!-- 左サイドバー -->
        <div class="sidebar">
            <div class="sidebar-window">
                <h3>Contents 1</h3>
                <div class="window-body">
                    <p>本日のランダムgif：</p>
                    <div class="random-box">
                        <img id="random-gif" src="" alt="ランダムGIF">
                    </div>
                </div>
            </div>

            <div class="sidebar-window">
                <h3>Contents 2</h3>
                <div class="window-body">
                    <ul>
                        <li><a href="#" target="_blank">Twitter</a></li>
                        <li><a href="#" target="_blank">Instagram</a></li>
                    </ul>
                </div>
            </div>
        </div>

        <!-- 右メインコンテンツ -->
        <div class="main-content">
            <h2>The Main Menu</h2>
            <p>Welcome to chanmana.com</p>
            
            <div class="sidebar-window" style="margin-top: 20px;">
                <h3>Contents 3</h3>
                <div class="window-body">
                    <p>ここにメインコンテンツや本文を記述します。</p>
                </div>
            </div>
        </div>

    </div>

    <!-- フッター -->
    <footer>
        <p>© chanmana.com All Rights Reserved.</p>
    </footer>

    <!-- ランダム画像用JavaScript（処理内容は維持） -->
    <script>
        const images = [
            "7sel3_1.gif",
            "7sel3_2.gif",
            "7sel3_3.gif"
        ];
        const randomIndex = Math.floor(Math.random() * images.length);
        document.getElementById("random-gif").src = images[randomIndex];
    </script>
</body>
</html>
