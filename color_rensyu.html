<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>色の考察練習</title>
    <style>
        /* 全体設定 */
        body {
            background-color: #e5e5e5;
            color: #000000;
            font-family: "Times New Roman", Times, "Yu Mincho", serif;
            margin: 0;
            padding: 10px;
        }

        a {
            color: #0000ee;
            text-decoration: underline;
        }

        /* 外枠フレーム */
        .site-container {
            display: flex;
            background-color: #e5e5e5;
            border: 2px solid #000000;
            min-height: 550px;
            max-width: 1400px;
            margin: 0 auto;
            box-shadow: 3px 3px 0px rgba(0,0,0,0.2);
        }

        /* 👈 左側エリア（参照画像） */
        .sidebar {
            width: 35%;
            padding: 15px;
            box-sizing: border-box;
            flex-shrink: 0;
            border-right: 2px solid #000000;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .window-title {
            font-size: 14px;
            font-weight: bold;
            margin: 0 0 8px 0;
            border-bottom: 2px solid #000;
            padding-bottom: 2px;
        }

        /* 画像表示エリア */
        .photo-container {
            background: #cccccc;
            border: 1px solid #000000;
            width: 100%;
            height: 450px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .photo-container img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
        }

        .image-controls {
            display: flex;
            gap: 8px;
        }

        .image-controls button {
            flex: 1;
            padding: 6px;
            font-size: 12px;
            cursor: pointer;
            background-color: #d8d8d8;
            border: 1px solid #000;
        }
        .image-controls button:hover {
            background-color: #bfbfbf;
        }

        .credit-info {
            font-size: 11px;
            color: #333;
            text-align: center;
            line-height: 1.4;
            word-break: break-all;
        }

        /* 👉 右側メインエリア */
        .main-content {
            flex: 1;
            padding: 15px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .workspace {
            display: flex;
            gap: 20px;
            align-items: flex-start;
        }

        /* 6×4 グリッド (1600×900比率・表示サイズ 533px × 300px・計24マス) */
        .grid-container {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            grid-template-rows: repeat(4, 1fr);
            width: 533px;
            height: 300px;
            background-color: #d8d8d8;
            border: 1px solid #000000;
            flex-shrink: 0;
        }

        .grid-cell {
            background-color: #d8d8d8;
            border: 1px solid rgba(0, 0, 0, 0.1);
            box-sizing: border-box;
            cursor: pointer;
            outline: none !important;
        }

        .grid-cell.selected {
            outline: 2px solid #000000 !important;
            z-index: 2;
        }

        /* 🎨 カラーパレットエリア */
        .palette-panel {
            border: 1px solid #000000;
            background-color: #d8d8d8;
            padding: 10px;
            font-family: sans-serif;
            font-size: 12px;
            flex: 1;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }

        .picker-container {
            position: relative;
            width: 180px;
            height: 180px;
            cursor: crosshair;
        }

        #pickerCanvas {
            display: block;
        }

        .sliders-section {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .slider-group-title {
            font-weight: bold;
            font-size: 11px;
            border-bottom: 1px solid #aaa;
            padding-bottom: 2px;
        }

        .slider-row {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 11px;
            font-weight: bold;
        }

        .slider-row label {
            width: 15px;
        }

        .slider-row input[type="range"] {
            flex: 1;
            height: 10px;
            cursor: pointer;
        }

        .slider-row span {
            width: 32px;
            text-align: right;
            font-family: monospace;
        }

        .color-values {
            display: flex;
            justify-content: space-around;
            width: 100%;
            font-family: monospace;
            font-size: 11px;
            border-top: 1px solid #aaaaaa;
            padding-top: 6px;
        }

        /* 💾 Saveボタン用スタイル */
        .save-btn {
            width: 100%;
            padding: 8px;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
            background-color: #e5e5e5;
            border: 1px solid #000000;
            box-shadow: 1px 1px 0px rgba(0,0,0,0.3);
            margin-top: 4px;
        }
        .save-btn:hover {
            background-color: #bfbfbf;
        }
    </style>
</head>
<body>

    <div class="site-container">

        <!-- 👈 左側：参照画像エリア -->
        <div class="sidebar">
            <div class="window-title">参照画像</div>
            
            <div class="photo-container">
                <img id="ref-image" src="" alt="参照画像" onerror="handleImgError(this)">
            </div>

            <div class="image-controls">
                <button id="prev-img-btn">← 前の画像</button>
                <button id="next-img-btn">次の画像 →</button>
            </div>

            <div class="credit-info">
                <div>画像引用: <span id="image-source">Courtesy of Unsplash / Photo by Unsplash Contributors</span></div>
            </div>
        </div>

        <!-- 👉 右側メインエリア -->
        <div class="main-content">
            <div class="window-title" style="width: 100%;">6×4 色彩単純化グリッド (横長: W1600×H900px比率 / 計24マス)</div>

            <div class="workspace">
                <!-- 6×4 グリッド (計24マス) -->
                <div class="grid-container" id="gridContainer"></div>

                <!-- 右：カラーパレット類 -->
                <div class="palette-panel">
                    <div style="font-weight: bold; font-size: 11px;">カラーパレット</div>
                    
                    <div class="picker-container">
                        <canvas id="pickerCanvas" width="180" height="180"></canvas>
                    </div>

                    <div class="sliders-section">
                        <div class="slider-group-title">RGB (赤・緑・青)</div>
                        <div class="slider-row" style="color: #c00000;">
                            <label>R</label>
                            <input type="range" id="sliderR" min="0" max="255" value="216">
                            <span id="textR">216</span>
                        </div>
                        <div class="slider-row" style="color: #008000;">
                            <label>G</label>
                            <input type="range" id="sliderG" min="0" max="255" value="216">
                            <span id="textG">216</span>
                        </div>
                        <div class="slider-row" style="color: #0000c0;">
                            <label>B</label>
                            <input type="range" id="sliderB" min="0" max="255" value="216">
                            <span id="textB">216</span>
                        </div>

                        <div class="slider-group-title">HSB (色相・彩度・明度)</div>
                        <div class="slider-row" style="color: #555;">
                            <label>H</label>
                            <input type="range" id="sliderH" min="0" max="360" value="0">
                            <span id="textH">0°</span>
                        </div>
                        <div class="slider-row" style="color: #555;">
                            <label>S</label>
                            <input type="range" id="sliderS" min="0" max="100" value="0">
                            <span id="textS">0%</span>
                        </div>
                        <div class="slider-row" style="color: #555;">
                            <label>B</label>
                            <input type="range" id="sliderVal" min="0" max="100" value="85">
                            <span id="textVal">85%</span>
                        </div>
                    </div>

                    <div class="color-values">
                        <div><strong>HEX:</strong> <span id="val-hex">#D8D8D8</span></div>
                    </div>

                    <!-- 💾 Saveボタン -->
                    <button class="save-btn" id="saveBtn">PNG保存 (別タブで開く)</button>
                </div>
            </div>
        </div>

    </div>

    <script>
        /* 指定カテゴリ：建築、自然、夏、映画、山、空、海 */
        const sampleImages = [];
        const layoutCategories = [
            "architecture,building,structure,perspective",
            "nature,forest,landscape,depth",
            "summer,sunshine,green,cloudy-sky",
            "cinematic,cinematic-landscape,dramatic-lighting",
            "mountain,peaks,mountain-range",
            "sky,clouds,horizon,sunset-sky",
            "ocean,sea,coastline,beach"
        ];

        for (let i = 1; i <= 100; i++) {
            const keyword = layoutCategories[i % layoutCategories.length];
            sampleImages.push({
                url: `https://source.unsplash.com/1600x900/?${keyword}&sig=${i + 700}`,
                fallbackUrl: `https://picsum.photos/1600/900?random=${i + 700}`
            });
        }

        let currentImageIndex = 0;
        const refImage = document.getElementById("ref-image");

        function updateImage() {
            const imgData = sampleImages[currentImageIndex];
            refImage.src = imgData.url;
        }

        function handleImgError(img) {
            const imgData = sampleImages[currentImageIndex];
            if (img.src !== imgData.fallbackUrl) {
                img.src = imgData.fallbackUrl;
            } else {
                img.onerror = null;
                img.src = "https://via.placeholder.com/1600x900/d8d8d8/000000?text=Image+Load+Error";
            }
        }

        document.getElementById("prev-img-btn").addEventListener("click", () => {
            currentImageIndex = (currentImageIndex - 1 + sampleImages.length) % sampleImages.length;
            updateImage();
        });

        document.getElementById("next-img-btn").addEventListener("click", () => {
            currentImageIndex = (currentImageIndex + 1) % sampleImages.length;
            updateImage();
        });

        /* 6×4 (計24マス) グリッド生成 */
        const gridContainer = document.getElementById("gridContainer");
        let selectedCell = null;

        for (let i = 0; i < 24; i++) {
            const cell = document.createElement("div");
            cell.classList.add("grid-cell");
            cell.dataset.color = "#d8d8d8";
            cell.addEventListener("click", () => {
                if (selectedCell) selectedCell.classList.remove("selected");
                selectedCell = cell;
                selectedCell.classList.add("selected");
            });
            gridContainer.appendChild(cell);
        }
        selectedCell = gridContainer.children[0];
        selectedCell.classList.add("selected");

        /* カラーパレット制御 */
        const canvas = document.getElementById("pickerCanvas");
        const ctx = canvas.getContext("2d");
        const size = canvas.width, center = size / 2, outerRadius = 85, innerRadius = 68, boxSize = 80;

        let currentHue = 0, currentSat = 0, currentVal = 85, activeTarget = null;

        const sliderR = document.getElementById("sliderR"), sliderG = document.getElementById("sliderG"), sliderB = document.getElementById("sliderB");
        const textR = document.getElementById("textR"), textG = document.getElementById("textG"), textB = document.getElementById("textB");
        const sliderH = document.getElementById("sliderH"), sliderS = document.getElementById("sliderS"), sliderVal = document.getElementById("sliderVal");
        const textH = document.getElementById("textH"), textS = document.getElementById("textS"), textVal = document.getElementById("textVal");

        function renderPicker() {
            ctx.clearRect(0, 0, size, size);

            for (let angle = 0; angle < 360; angle += 0.5) {
                const startAngle = (angle - 0.6) * Math.PI / 180, endAngle = (angle + 0.6) * Math.PI / 180;
                ctx.beginPath();
                ctx.arc(center, center, (outerRadius + innerRadius) / 2, startAngle, endAngle);
                ctx.strokeStyle = `hsl(${angle}, 100%, 50%)`;
                ctx.lineWidth = outerRadius - innerRadius;
                ctx.stroke();
            }

            const x0 = center - boxSize / 2, y0 = center - boxSize / 2;
            ctx.fillStyle = `hsl(${currentHue}, 100%, 50%)`;
            ctx.fillRect(x0, y0, boxSize, boxSize);

            const gradWhite = ctx.createLinearGradient(x0, y0, x0 + boxSize, y0);
            gradWhite.addColorStop(0, 'rgba(255,255,255,1)');
            gradWhite.addColorStop(1, 'rgba(255,255,255,0)');
            ctx.fillStyle = gradWhite;
            ctx.fillRect(x0, y0, boxSize, boxSize);

            const gradBlack = ctx.createLinearGradient(x0, y0, x0, y0 + boxSize);
            gradBlack.addColorStop(0, 'rgba(0,0,0,0)');
            gradBlack.addColorStop(1, 'rgba(0,0,0,1)');
            ctx.fillStyle = gradBlack;
            ctx.fillRect(x0, y0, boxSize, boxSize);

            ctx.strokeStyle = "#000000";
            ctx.lineWidth = 1;
            ctx.strokeRect(x0, y0, boxSize, boxSize);

            const ringAngle = currentHue * Math.PI / 180, ringR = (outerRadius + innerRadius) / 2;
            ctx.beginPath();
            ctx.arc(center + ringR * Math.cos(ringAngle), center + ringR * Math.sin(ringAngle), 4, 0, Math.PI * 2);
            ctx.strokeStyle = "#ffffff"; ctx.lineWidth = 2; ctx.stroke();
            ctx.strokeStyle = "#000000"; ctx.lineWidth = 1; ctx.stroke();

            ctx.beginPath();
            ctx.arc(x0 + (currentSat / 100) * boxSize, y0 + (1 - currentVal / 100) * boxSize, 4, 0, Math.PI * 2);
            ctx.strokeStyle = "#ffffff"; ctx.lineWidth = 2; ctx.stroke();
            ctx.strokeStyle = "#000000"; ctx.lineWidth = 1; ctx.stroke();
        }

        function handlePointer(e) {
            const rect = canvas.getBoundingClientRect();
            const x = e.clientX - rect.left, y = e.clientY - rect.top;
            const dx = x - center, dy = y - center, dist = Math.sqrt(dx * dx + dy * dy);
            const x0 = center - boxSize / 2, y0 = center - boxSize / 2;

            if (activeTarget === 'ring' || (!activeTarget && dist >= innerRadius && dist <= outerRadius)) {
                activeTarget = 'ring';
                let angle = Math.atan2(dy, dx) * (180 / Math.PI);
                if (angle < 0) angle += 360;
                currentHue = angle;
            } else if (activeTarget === 'box' || (!activeTarget && x >= x0 && x <= x0 + boxSize && y >= y0 && y <= y0 + boxSize)) {
                activeTarget = 'box';
                currentSat = Math.max(0, Math.min(100, ((x - x0) / boxSize) * 100));
                currentVal = Math.max(0, Math.min(100, (1 - (y - y0) / boxSize) * 100));
            }
            renderPicker();
            updateFromHSV();
        }

        canvas.addEventListener("mousedown", (e) => { activeTarget = null; handlePointer(e); });
        canvas.addEventListener("mousemove", (e) => { if (e.buttons === 1) handlePointer(e); });
        document.addEventListener("mouseup", () => { activeTarget = null; });

        function updateFromHSV() {
            const rgb = hsvToRgb(currentHue, currentSat, currentVal);
            sliderR.value = rgb.r; sliderG.value = rgb.g; sliderB.value = rgb.b;
            sliderH.value = Math.round(currentHue); sliderS.value = Math.round(currentSat); sliderVal.value = Math.round(currentVal);
            applyColorToUI(rgb.r, rgb.g, rgb.b);
        }

        function updateFromSlidersRGB() {
            const r = parseInt(sliderR.value), g = parseInt(sliderG.value), b = parseInt(sliderB.value);
            const hsv = rgbToHsv(r, g, b);
            currentHue = hsv.h; currentSat = hsv.s; currentVal = hsv.v;
            sliderH.value = Math.round(currentHue); sliderS.value = Math.round(currentSat); sliderVal.value = Math.round(currentVal);
            renderPicker();
            applyColorToUI(r, g, b);
        }

        function updateFromSlidersHSB() {
            currentHue = parseFloat(sliderH.value); currentSat = parseFloat(sliderS.value); currentVal = parseFloat(sliderVal.value);
            const rgb = hsvToRgb(currentHue, currentSat, currentVal);
            sliderR.value = rgb.r; sliderG.value = rgb.g; sliderB.value = rgb.b;
            renderPicker();
            applyColorToUI(rgb.r, rgb.g, rgb.b);
        }

        sliderR.addEventListener("input", updateFromSlidersRGB);
        sliderG.addEventListener("input", updateFromSlidersRGB);
        sliderB.addEventListener("input", updateFromSlidersRGB);
        sliderH.addEventListener("input", updateFromSlidersHSB);
        sliderS.addEventListener("input", updateFromSlidersHSB);
        sliderVal.addEventListener("input", updateFromSlidersHSB);

        function applyColorToUI(r, g, b) {
            textR.textContent = r; textG.textContent = g; textB.textContent = b;
            textH.textContent = `${Math.round(currentHue)}°`; textS.textContent = `${Math.round(currentSat)}%`; textVal.textContent = `${Math.round(currentVal)}%`;
            const hex = rgbToHex(r, g, b);
            if (selectedCell) { selectedCell.style.backgroundColor = hex; selectedCell.dataset.color = hex; }
            document.getElementById("val-hex").textContent = hex.toUpperCase();
        }

        function hsvToRgb(h, s, v) {
            s /= 100; v /= 100;
            let i = Math.floor(h / 60) % 6, f = h / 60 - Math.floor(h / 60);
            let p = v * (1 - s), q = v * (1 - f * s), t = v * (1 - (1 - f) * s);
            let r, g, b;
            switch (i) {
                case 0: r = v; g = t; b = p; break;
                case 1: r = q; g = v; b = p; break;
                case 2: r = p; g = v; b = t; break;
                case 3: r = p; g = q; b = v; break;
                case 4: r = t; g = p; b = v; break;
                case 5: r = v; g = p; b = q; break;
            }
            return { r: Math.round(r * 255), g: Math.round(g * 255), b: Math.round(b * 255) };
        }

        function rgbToHsv(r, g, b) {
            r /= 255; g /= 255; b /= 255;
            let max = Math.max(r, g, b), min = Math.min(r, g, b), d = max - min, h, s = max === 0 ? 0 : d / max, v = max;
            if (max === min) h = 0;
            else {
                switch (max) {
                    case r: h = (g - b) / d + (g < b ? 6 : 0); break;
                    case g: h = (b - r) / d + 2; break;
                    case b: h = (r - g) / d + 4; break;
                }
                h /= 6;
            }
            return { h: h * 360, s: s * 100, v: v * 100 };
        }

        function rgbToHex(r, g, b) {
            return "#" + [r, g, b].map(x => x.toString(16).padStart(2, '0')).join('');
        }

        /* 🖼️ PNG保存機能 (グリッド＋日付の書き出し＆別窓表示) */
        document.getElementById("saveBtn").addEventListener("click", () => {
            const cols = 6;
            const rows = 4;
            const cellWidth = 200;
            const cellHeight = 112.5; // 16:9比率相当
            const paddingBottom = 60;  // 日付描画用の下部スペース

            const exportCanvas = document.createElement("canvas");
            exportCanvas.width = cols * cellWidth;
            exportCanvas.height = (rows * cellHeight) + paddingBottom;
            const expCtx = exportCanvas.getContext("2d");

            // 背景描画
            expCtx.fillStyle = "#ffffff";
            expCtx.fillRect(0, 0, exportCanvas.width, exportCanvas.height);

            // グリッドセルの描画
            const cells = gridContainer.children;
            for (let i = 0; i < cells.length; i++) {
                const c = i % cols;
                const r = Math.floor(i / cols);
                const x = c * cellWidth;
                const y = r * cellHeight;

                expCtx.fillStyle = cells[i].dataset.color || "#d8d8d8";
                expCtx.fillRect(x, y, cellWidth, cellHeight);

                expCtx.strokeStyle = "rgba(0, 0, 0, 0.15)";
                expCtx.lineWidth = 1;
                expCtx.strokeRect(x, y, cellWidth, cellHeight);
            }

            // 外枠を描画
            expCtx.strokeStyle = "#000000";
            expCtx.lineWidth = 2;
            expCtx.strokeRect(0, 0, cols * cellWidth, rows * cellHeight);

            // 日付文字列を取得 (YYYY/MM/DD)
            const now = new Date();
            const year = now.getFullYear();
            const month = String(now.getMonth() + 1).padStart(2, '0');
            const day = String(now.getDate()).padStart(2, '0');
            const dateStr = `${year}/${month}/${day}`;

            // 日付テキストの描画 (右下配置)
            expCtx.fillStyle = "#000000";
            expCtx.font = "bold 24px 'Times New Roman', serif";
            expCtx.textAlign = "right";
            expCtx.textBaseline = "middle";
            expCtx.fillText(dateStr, exportCanvas.width - 20, (rows * cellHeight) + (paddingBottom / 2));

            // PNGデータURLを生成し、別タブで開く
            const dataUrl = exportCanvas.toDataURL("image/png");
            const newWindow = window.open();
            if (newWindow) {
                newWindow.document.write(`
                    <!DOCTYPE html>
                    <html>
                    <head>
                        <title>Color Grid - ${dateStr}</title>
                        <style>
                            body { margin: 0; background-color: #222; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
                            img { max-width: 95%; height: auto; box-shadow: 0 0 20px rgba(0,0,0,0.5); background: #fff; }
                        </style>
                    </head>
                    <body>
                        <img src="${dataUrl}" alt="Color Grid Output">
                    </body>
                    </html>
                `);
                newWindow.document.close();
            } else {
                alert("ポップアップがブロックされました。ブラウザの設定でポップアップを許可してください。");
            }
        });

        updateImage();
        renderPicker();
        updateFromHSV();
    </script>
</body>
</html>
