<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>chanmana.com - 色の考察練習</title>
    <style>
        /* 全体設定 */
        body {
            background-color: #5bb3f0;
            color: #000000;
            font-family: "Times New Roman", Times, "Yu Mincho", serif;
            margin: 0;
            padding: 10px;
            position: relative;
        }

        a {
            color: #0000ee;
            text-decoration: underline;
        }

        /* ヘッダー */
        header {
            text-align: center;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
        }
        header h1 {
            font-size: 28px;
            font-weight: bold;
            margin: 0;
        }

        /* 外枠フレーム（背景を彩度0のライトグレー） */
        .site-container {
            display: flex;
            background-color: #e5e5e5;
            border: 2px solid #000000;
            min-height: 550px;
            max-width: 1050px;
            margin: 0 auto;
            box-shadow: 3px 3px 0px rgba(0,0,0,0.2);
        }

        /* 👈 左側エリア（参照画像） */
        .sidebar {
            width: 40%;
            padding: 15px;
            box-sizing: border-box;
            flex-shrink: 0;
            border-right: 2px solid #000000;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .window-title {
            font-size: 14px;
            font-weight: bold;
            margin: 0 0 8px 0;
            border-bottom: 2px solid #000;
            padding-bottom: 2px;
        }

        /* 画像表示エリア */
        .photo-container {
            background: #cccccc;
            border: 1px solid #000000;
            width: 100%;
            height: 380px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .photo-container img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
        }

        .image-controls {
            display: flex;
            gap: 8px;
        }

        .image-controls button {
            flex: 1;
            padding: 6px;
            font-size: 12px;
            cursor: pointer;
            background-color: #d8d8d8;
            border: 1px solid #000;
        }
        .image-controls button:hover {
            background-color: #bfbfbf;
        }

        /* 👉 右側メインエリア */
        .main-content {
            flex: 1;
            padding: 15px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        /* 作業エリア：左にグリッド、右にカラーパレット類 */
        .workspace {
            display: flex;
            gap: 15px;
            align-items: flex-start;
        }

        /* 4×4 グリッド（線幅0・外枠なし・選択枠なし） */
        .grid-container {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            grid-template-rows: repeat(4, 1fr);
            gap: 0px;
            width: 280px;
            height: 280px;
            border: 0px;
            padding: 0px;
            box-sizing: border-box;
            background-color: #d8d8d8;
            flex-shrink: 0;
        }

        .grid-cell {
            background-color: #d8d8d8;
            border: 0px;
            cursor: pointer;
            outline: none !important;
        }

        /* 🎨 右側のカラーパレットエリア */
        .palette-panel {
            border: 1px solid #000000;
            background-color: #d8d8d8;
            padding: 10px;
            font-family: sans-serif;
            font-size: 12px;
            flex: 1;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        .picker-container {
            position: relative;
            width: 180px;
            height: 180px;
            cursor: crosshair;
        }

        #pickerCanvas {
            display: block;
        }

        /* RGBバー（スライダー）スタイル */
        .rgb-sliders {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .slider-row {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 11px;
            font-weight: bold;
        }

        .slider-row label {
            width: 15px;
        }

        .slider-row input[type="range"] {
            flex: 1;
            height: 12px;
            cursor: pointer;
        }

        .slider-row span {
            width: 28px;
            text-align: right;
            font-family: monospace;
        }

        /* 色数値表示 */
        .color-values {
            display: flex;
            justify-content: space-between;
            width: 100%;
            font-family: monospace;
            font-size: 11px;
            border-top: 1px solid #aaaaaa;
            padding-top: 6px;
        }

        footer {
            margin-top: 15px;
            text-align: center;
            font-size: 12px;
            color: #000000;
        }
    </style>
</head>
<body>

    <!-- ヘッダー -->
    <header>
        <h1>chanmana.com</h1>
    </header>

    <!-- メインフレーム構造 -->
    <div class="site-container">

        <!-- 👈 左側：参照画像エリア -->
        <div class="sidebar">
            <div class="window-title">参照画像 (名画コレクション)</div>
            
            <div class="photo-container">
                <img id="ref-image" src="" alt="参照画像" onerror="handleImgError(this)">
            </div>

            <div class="image-controls">
                <button id="prev-img-btn">← 前の画像</button>
                <button id="next-img-btn">次の画像 →</button>
            </div>
            <div style="font-size: 11px; color: #333; text-align: center; margin-top: 2px;">
                <span id="image-counter">1 / 8</span>: <span id="image-caption">-</span>
            </div>
        </div>

        <!-- 👉 右側メインエリア -->
        <div class="main-content">
            <div class="window-title" style="width: 100%;">4×4 色彩単純化グリッド</div>

            <div class="workspace">
                <!-- 左：4×4 グリッド -->
                <div class="grid-container" id="gridContainer"></div>

                <!-- 右：カラーパレット類（サークル ＋ RGBバー ＋ 数値） -->
                <div class="palette-panel">
                    <div style="font-weight: bold; font-size: 11px;">カラーパレット</div>
                    
                    <!-- カラーサークル -->
                    <div class="picker-container">
                        <canvas id="pickerCanvas" width="180" height="180"></canvas>
                    </div>

                    <!-- RGB スライダーバー -->
                    <div class="rgb-sliders">
                        <div class="slider-row" style="color: #c00000;">
                            <label>R</label>
                            <input type="range" id="sliderR" min="0" max="255" value="216">
                            <span id="textR">216</span>
                        </div>
                        <div class="slider-row" style="color: #008000;">
                            <label>G</label>
                            <input type="range" id="sliderG" min="0" max="255" value="216">
                            <span id="textG">216</span>
                        </div>
                        <div class="slider-row" style="color: #0000c0;">
                            <label>B</label>
                            <input type="range" id="sliderB" min="0" max="255" value="216">
                            <span id="textB">216</span>
                        </div>
                    </div>

                    <!-- 数値表示 -->
                    <div class="color-values">
                        <div><strong>HEX:</strong> <span id="val-hex">#D8D8D8</span></div>
                        <div><strong>HSB:</strong> <span id="val-hsb">0°,0%,85%</span></div>
                    </div>
                </div>
            </div>
        </div>

    </div>

    <!-- フッター -->
    <footer>
        <p>© chanmana.com All Rights Reserved.</p>
    </footer>

    <script>
        /* 1. 名画コレクション */
        const sampleImages = [
            {
                title: "クロード・モネ『印象・日の出』",
                url: "https://upload.wikimedia.org/wikipedia/commons/thumb/5/54/Claude_Monet%2C_Impression%2C_soleil_levant.jpg/800px-Claude_Monet%2C_Impression%2C_soleil_levant.jpg"
            },
            {
                title: "フィンセント・ファン・ゴッホ『星月夜』",
                url: "https://upload.wikimedia.org/wikipedia/commons/thumb/e/ea/VanGogh-starry_night.jpg/800px-VanGogh-starry_night.jpg"
            },
            {
                title: "葛飾北斎『神奈川沖浪裏』",
                url: "https://upload.wikimedia.org/wikipedia/commons/thumb/a/a5/Tsunami_by_hokusai_19th_century.jpg/800px-Tsunami_by_hokusai_19th_century.jpg"
            },
            {
                title: "ヨハネス・フェルマーク『真珠の耳飾りの少女』",
                url: "https://upload.wikimedia.org/wikipedia/commons/thumb/0/0f/1665_Girl_with_a_Pearl_Earring.jpg/800px-1665_Girl_with_a_Pearl_Earring.jpg"
            },
            {
                title: "グスタフ・クリムト『接吻』",
                url: "https://upload.wikimedia.org/wikipedia/commons/thumb/4/40/The_Kiss_-_Gustav_Klimt_-_Google_Cultural_Institute.jpg/800px-The_Kiss_-_Gustav_Klimt_-_Google_Cultural_Institute.jpg"
            },
            {
                title: "ピエール＝オーギュスト・ルノワール『ムーラン・ド・ラ・ギャレットの舞踏会』",
                url: "https://upload.wikimedia.org/wikipedia/commons/thumb/2/21/Pierre-Auguste_Renoir%2C_Bal_du_moulin_de_la_Galette.jpg/800px-Pierre-Auguste_Renoir%2C_Bal_du_moulin_de_la_Galette.jpg"
            },
            {
                title: "クロード・モネ『睡蓮の池』",
                url: "https://upload.wikimedia.org/wikipedia/commons/thumb/1/10/Claude_Monet_-_Water_Lilies_-_1906%2C_Ryerson.jpg/800px-Claude_Monet_-_Water_Lilies_-_1906%2C_Ryerson.jpg"
            },
            {
                title: "フィンセント・ファン_ゴッホ『夜のカフェテラス』",
                url: "https://upload.wikimedia.org/wikipedia/commons/thumb/b/b1/Vincent_Van_Gogh_-_Caf%C3%A9_Terrace_at_Night_%281888%29.jpg/800px-Vincent_Van_Gogh_-_Caf%C3%A9_Terrace_at_Night_%281888%29.jpg"
            }
        ];

        let currentImageIndex = 0;
        const refImage = document.getElementById("ref-image");
        const imageCaption = document.getElementById("image-caption");
        const imageCounter = document.getElementById("image-counter");

        function updateImage() {
            const imgData = sampleImages[currentImageIndex];
            refImage.src = imgData.url;
            imageCaption.textContent = imgData.title;
            imageCounter.textContent = `${currentImageIndex + 1} / ${sampleImages.length}`;
        }

        function handleImgError(img) {
            img.onerror = null;
            img.src = "https://via.placeholder.com/600x400/d8d8d8/000000?text=Image+Load+Error";
        }

        document.getElementById("prev-img-btn").addEventListener("click", () => {
            currentImageIndex = (currentImageIndex - 1 + sampleImages.length) % sampleImages.length;
            updateImage();
        });

        document.getElementById("next-img-btn").addEventListener("click", () => {
            currentImageIndex = (currentImageIndex + 1) % sampleImages.length;
            updateImage();
        });

        /* 2. 4×4 グリッド生成 */
        const gridContainer = document.getElementById("gridContainer");
        let selectedCell = null;

        for (let i = 0; i < 16; i++) {
            const cell = document.createElement("div");
            cell.classList.add("grid-cell");
            cell.dataset.color = "#d8d8d8";
            
            cell.addEventListener("click", () => {
                selectedCell = cell;
            });

            gridContainer.appendChild(cell);
        }
        selectedCell = gridContainer.children[0];

        /* 3. カラーサークル ＆ RGBスライダー連携 */
        const canvas = document.getElementById("pickerCanvas");
        const ctx = canvas.getContext("2d");
        const size = canvas.width;
        const center = size / 2;
        const outerRadius = 85;
        const innerRadius = 68;
        const boxSize = 80;

        let currentHue = 0;        // 0 ~ 360
        let currentSat = 0;        // 0 ~ 100
        let currentVal = 85;       // 0 ~ 100
        let activeTarget = null;   // 'ring' or 'box'

        const sliderR = document.getElementById("sliderR");
        const sliderG = document.getElementById("sliderG");
        const sliderB = document.getElementById("sliderB");
        const textR = document.getElementById("textR");
        const textG = document.getElementById("textG");
        const textB = document.getElementById("textB");

        function renderPicker() {
            ctx.clearRect(0, 0, size, size);

            // 外側：Hue(色相)リング
            for (let angle = 0; angle < 360; angle += 0.5) {
                const startAngle = (angle - 0.6) * Math.PI / 180;
                const endAngle = (angle + 0.6) * Math.PI / 180;
                ctx.beginPath();
                ctx.arc(center, center, (outerRadius + innerRadius) / 2, startAngle, endAngle);
                ctx.strokeStyle = `hsl(${angle}, 100%, 50%)`;
                ctx.lineWidth = outerRadius - innerRadius;
                ctx.stroke();
            }

            // 内側：SV(彩度・明度)四角形
            const x0 = center - boxSize / 2;
            const y0 = center - boxSize / 2;

            ctx.fillStyle = `hsl(${currentHue}, 100%, 50%)`;
            ctx.fillRect(x0, y0, boxSize, boxSize);

            const gradWhite = ctx.createLinearGradient(x0, y0, x0 + boxSize, y0);
            gradWhite.addColorStop(0, 'rgba(255,255,255,1)');
            gradWhite.addColorStop(1, 'rgba(255,255,255,0)');
            ctx.fillStyle = gradWhite;
            ctx.fillRect(x0, y0, boxSize, boxSize);

            const gradBlack = ctx.createLinearGradient(x0, y0, x0, y0 + boxSize);
            gradBlack.addColorStop(0, 'rgba(0,0,0,0)');
            gradBlack.addColorStop(1, 'rgba(0,0,0,1)');
            ctx.fillStyle = gradBlack;
            ctx.fillRect(x0, y0, boxSize, boxSize);

            ctx.strokeStyle = "#000000";
            ctx.lineWidth = 1;
            ctx.strokeRect(x0, y0, boxSize, boxSize);

            // ポインター描画
            const ringAngle = currentHue * Math.PI / 180;
            const ringR = (outerRadius + innerRadius) / 2;
            const rx = center + ringR * Math.cos(ringAngle);
            const ry = center + ringR * Math.sin(ringAngle);
            ctx.beginPath();
            ctx.arc(rx, ry, 4, 0, Math.PI * 2);
            ctx.strokeStyle = "#ffffff";
            ctx.lineWidth = 2;
            ctx.stroke();
            ctx.strokeStyle = "#000000";
            ctx.lineWidth = 1;
            ctx.stroke();

            const bx = x0 + (currentSat / 100) * boxSize;
            const by = y0 + (1 - currentVal / 100) * boxSize;
            ctx.beginPath();
            ctx.arc(bx, by, 4, 0, Math.PI * 2);
            ctx.strokeStyle = "#ffffff";
            ctx.lineWidth = 2;
            ctx.stroke();
            ctx.strokeStyle = "#000000";
            ctx.lineWidth = 1;
            ctx.stroke();
        }

        /* カラーサークルの操作ハンドラ */
        function handlePointer(e) {
            const rect = canvas.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;

            const dx = x - center;
            const dy = y - center;
            const dist = Math.sqrt(dx * dx + dy * dy);

            const x0 = center - boxSize / 2;
            const y0 = center - boxSize / 2;

            if (activeTarget === 'ring' || (!activeTarget && dist >= innerRadius && dist <= outerRadius)) {
                activeTarget = 'ring';
                let angle = Math.atan2(dy, dx) * (180 / Math.PI);
                if (angle < 0) angle += 360;
                currentHue = angle;
            } else if (activeTarget === 'box' || (!activeTarget && x >= x0 && x <= x0 + boxSize && y >= y0 && y <= y0 + boxSize)) {
                activeTarget = 'box';
                let sat = ((x - x0) / boxSize) * 100;
                let val = (1 - (y - y0) / boxSize) * 100;
                currentSat = Math.max(0, Math.min(100, sat));
                currentVal = Math.max(0, Math.min(100, val));
            }

            renderPicker();
            updateFromPicker();
        }

        canvas.addEventListener("mousedown", (e) => { activeTarget = null; handlePointer(e); });
        canvas.addEventListener("mousemove", (e) => { if (e.buttons === 1) handlePointer(e); });
        document.addEventListener("mouseup", () => { activeTarget = null; });

        /* サークル操作からの更新 */
        function updateFromPicker() {
            const rgb = hsvToRgb(currentHue, currentSat, currentVal);
            
            sliderR.value = rgb.r;
            sliderG.value = rgb.g;
            sliderB.value = rgb.b;

            applyColorToUI(rgb.r, rgb.g, rgb.b);
        }

        /* RGBスライダー操作からの更新 */
        function updateFromSliders() {
            const r = parseInt(sliderR.value);
            const g = parseInt(sliderG.value);
            const b = parseInt(sliderB.value);

            const hsv = rgbToHsv(r, g, b);
            currentHue = hsv.h;
            currentSat = hsv.s;
            currentVal = hsv.v;

            renderPicker();
            applyColorToUI(r, g, b);
        }

        sliderR.addEventListener("input", updateFromSliders);
        sliderG.addEventListener("input", updateFromSliders);
        sliderB.addEventListener("input", updateFromSliders);

        /* UI全体に色を適用する共通関数 */
        function applyColorToUI(r, g, b) {
            textR.textContent = r;
            textG.textContent = g;
            textB.textContent = b;

            const hex = rgbToHex(r, g, b);

            if (selectedCell) {
                selectedCell.style.backgroundColor = hex;
                selectedCell.dataset.color = hex;
            }

            document.getElementById("val-hex").textContent = hex.toUpperCase();
            document.getElementById("val-hsb").textContent = `${Math.round(currentHue)}°,${Math.round(currentSat)}%,${Math.round(currentVal)}%`;
        }

        /* 色変換ユーティリティ */
        function hsvToRgb(h, s, v) {
            s /= 100; v /= 100;
            let r, g, b;
            let i = Math.floor(h / 60) % 6;
            let f = h / 60 - Math.floor(h / 60);
            let p = v * (1 - s);
            let q = v * (1 - f * s);
            let t = v * (1 - (1 - f) * s);

            switch (i) {
                case 0: r = v; g = t; b = p; break;
                case 1: r = q; g = v; b = p; break;
                case 2: r = p; g = v; b = t; break;
                case 3: r = p; g = q; b = v; break;
                case 4: r = t; g = p; b = v; break;
                case 5: r = v; g = p; b = q; break;
            }
            return { r: Math.round(r * 255), g: Math.round(g * 255), b: Math.round(b * 255) };
        }

        function rgbToHsv(r, g, b) {
            r /= 255; g /= 255; b /= 255;
            let max = Math.max(r, g, b), min = Math.min(r, g, b);
            let h, s, v = max;
            let d = max - min;
            s = max === 0 ? 0 : d / max;

            if (max === min) {
                h = 0;
            } else {
                switch (max) {
                    case r: h = (g - b) / d + (g < b ? 6 : 0); break;
                    case g: h = (b - r) / d + 2; break;
                    case b: h = (r - g) / d + 4; break;
                }
                h /= 6;
            }
            return { h: h * 360, s: s * 100, v: v * 100 };
        }

        function rgbToHex(r, g, b) {
            return "#" + [r, g, b].map(x => x.toString(16).padStart(2, '0')).join('');
        }

        // 初期化実行
        updateImage();
        renderPicker();
        updateFromPicker();
    </script>
</body>
</html>
