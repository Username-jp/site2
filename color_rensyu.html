<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>chanmana.com - 色の考察練習</title>
    <style>
        /* 全体設定 */
        body {
            background-color: #5bb3f0;
            color: #000000;
            font-family: "Times New Roman", Times, "Yu Mincho", serif;
            margin: 0;
            padding: 10px;
            position: relative;
        }

        a {
            color: #0000ee;
            text-decoration: underline;
        }

        /* ヘッダー */
        header {
            text-align: center;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
        }
        header h1 {
            font-size: 28px;
            font-weight: bold;
            margin: 0;
        }

        /* 外枠フレーム（中央寄せ） */
        .site-container {
            display: flex;
            background-color: #ffffff;
            border: 2px solid #000000;
            min-height: 550px;
            max-width: 1000px;
            margin: 0 auto;
            box-shadow: 3px 3px 0px rgba(0,0,0,0.2);
        }

        /* 👈 左側エリア（参照画像） */
        .sidebar {
            width: 45%;
            padding: 15px;
            box-sizing: border-box;
            flex-shrink: 0;
            border-right: 2px solid #000000;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .window-title {
            font-size: 14px;
            font-weight: bold;
            margin: 0 0 8px 0;
            border-bottom: 2px solid #000;
            padding-bottom: 2px;
        }

        /* 画像表示エリア */
        .photo-container {
            background: #e0e0e0;
            border: 1px solid #000000;
            width: 100%;
            height: 380px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .photo-container img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
        }

        .image-controls {
            display: flex;
            gap: 8px;
        }

        .image-controls button {
            flex: 1;
            padding: 6px;
            font-size: 12px;
            cursor: pointer;
            background-color: #f0f0f0;
            border: 1px solid #000;
        }
        .image-controls button:hover {
            background-color: #e0e0e0;
        }

        /* 👉 右側メインエリア */
        .main-content {
            flex: 1;
            padding: 15px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            gap: 15px;
            align-items: center;
        }

        /* 4×4 グリッド（枠線0・隙間0・選択枠なし） */
        .grid-container {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            grid-template-rows: repeat(4, 1fr);
            gap: 0px;
            width: 320px;
            height: 320px;
            border: 0px;
            padding: 0px;
            box-sizing: border-box;
        }

        .grid-cell {
            background-color: #ffffff;
            border: 0px;
            cursor: pointer;
            outline: none !important;
        }

        /* 🎨 カラーサークルパレット (外枠リング + 内側スクエア) */
        .palette-panel {
            border: 1px solid #000000;
            background-color: #f5f5f5;
            padding: 10px;
            font-family: sans-serif;
            font-size: 12px;
            width: 100%;
            max-width: 320px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .picker-container {
            position: relative;
            width: 220px;
            height: 220px;
            margin: 5px 0;
            cursor: crosshair;
        }

        #pickerCanvas {
            display: block;
        }

        .color-values {
            display: flex;
            gap: 10px;
            font-family: monospace;
            font-size: 11px;
            margin-top: 5px;
        }

        footer {
            margin-top: 15px;
            text-align: center;
            font-size: 12px;
            color: #000000;
        }
    </style>
</head>
<body>

    <!-- ヘッダー -->
    <header>
        <h1>chanmana.com</h1>
    </header>

    <!-- メインフレーム構造 -->
    <div class="site-container">

        <!-- 👈 左側：参照画像エリア -->
        <div class="sidebar">
            <div class="window-title">参照画像 (風景・絵画)</div>
            
            <div class="photo-container">
                <img id="ref-image" src="" alt="参照画像" onerror="handleImgError(this)">
            </div>

            <div class="image-controls">
                <button id="prev-img-btn">← 前の画像</button>
                <button id="next-img-btn">次の画像 →</button>
            </div>
            <div style="font-size: 11px; color: #555; text-align: center;">
                作品名: <span id="image-caption">-</span>
            </div>
        </div>

        <!-- 👉 右側：4×4グリッド ＆ カラーサークル -->
        <div class="main-content">
            <div class="window-title" style="width: 100%;">4×4 色彩単純化グリッド</div>

            <!-- 4×4 グリッド -->
            <div class="grid-container" id="gridContainer"></div>

            <!-- カラーサークルパレット (リング + 正方形) -->
            <div class="palette-panel">
                <div style="font-weight: bold;">カラーサークル (HSB/HSV)</div>
                
                <div class="picker-container">
                    <canvas id="pickerCanvas" width="220" height="220"></canvas>
                </div>

                <div class="color-values">
                    <div><strong>HEX:</strong> <span id="val-hex">#FFFFFF</span></div>
                    <div><strong>RGB:</strong> <span id="val-rgb">255,255,255</span></div>
                    <div><strong>HSB:</strong> <span id="val-hsb">0°,0%,100%</span></div>
                </div>
            </div>
        </div>

    </div>

    <!-- フッター -->
    <footer>
        <p>© chanmana.com All Rights Reserved.</p>
    </footer>

    <script>
        /* 1. 参照画像設定 */
        const sampleImages = [
            {
                title: "クロード・モネ『印象・日の出』",
                url: "https://picsum.photos/id/1015/600/400"
            },
            {
                title: "ゴッホ『星月夜』風グラデーション",
                url: "https://picsum.photos/id/1043/600/400"
            },
            {
                title: "山脈と湖畔の風景",
                url: "https://picsum.photos/id/1018/600/400"
            },
            {
                title: "夕暮れのビル群と都市",
                url: "https://picsum.photos/id/1031/600/400"
            }
        ];

        let currentImageIndex = 0;
        const refImage = document.getElementById("ref-image");
        const imageCaption = document.getElementById("image-caption");

        function updateImage() {
            const imgData = sampleImages[currentImageIndex];
            refImage.src = imgData.url;
            imageCaption.textContent = imgData.title;
        }

        function handleImgError(img) {
            img.onerror = null;
            img.src = "https://via.placeholder.com/600x400/5bb3f0/ffffff?text=Sample+Landscape";
        }

        document.getElementById("prev-img-btn").addEventListener("click", () => {
            currentImageIndex = (currentImageIndex - 1 + sampleImages.length) % sampleImages.length;
            updateImage();
        });

        document.getElementById("next-img-btn").addEventListener("click", () => {
            currentImageIndex = (currentImageIndex + 1) % sampleImages.length;
            updateImage();
        });

        /* 2. 4×4 グリッド生成 */
        const gridContainer = document.getElementById("gridContainer");
        let selectedCell = null;

        for (let i = 0; i < 16; i++) {
            const cell = document.createElement("div");
            cell.classList.add("grid-cell");
            cell.dataset.color = "#ffffff";
            
            cell.addEventListener("click", () => {
                selectedCell = cell;
            });

            gridContainer.appendChild(cell);
        }
        selectedCell = gridContainer.children[0];

        /* 3. リング + 四角形 カラーサークル（Canvas描画） */
        const canvas = document.getElementById("pickerCanvas");
        const ctx = canvas.getContext("2d");
        const size = canvas.width;
        const center = size / 2;
        const outerRadius = 105;
        const innerRadius = 85;
        const boxSize = 100; // 内側の彩度・明度ボックスサイズ

        let currentHue = 0;        // 0 ~ 360
        let currentSat = 0;        // 0 ~ 100
        let currentVal = 100;      // 0 ~ 100
        let activeTarget = null;   // 'ring' or 'box'

        function renderPicker() {
            ctx.clearRect(0, 0, size, size);

            // A. 外側：Hue(色相)リングの描画
            for (let angle = 0; angle < 360; angle += 0.5) {
                const startAngle = (angle - 0.6) * Math.PI / 180;
                const endAngle = (angle + 0.6) * Math.PI / 180;
                ctx.beginPath();
                ctx.arc(center, center, (outerRadius + innerRadius) / 2, startAngle, endAngle);
                ctx.strokeStyle = `hsl(${angle}, 100%, 50%)`;
                ctx.lineWidth = outerRadius - innerRadius;
                ctx.stroke();
            }

            // B. 内側：SV(彩度・明度)四角形の描画
            const x0 = center - boxSize / 2;
            const y0 = center - boxSize / 2;

            // ベースの色（選択されたHue 100%）
            ctx.fillStyle = `hsl(${currentHue}, 100%, 50%)`;
            ctx.fillRect(x0, y0, boxSize, boxSize);

            // 水平方向：白（彩度 0%）グラデーション
            const gradWhite = ctx.createLinearGradient(x0, y0, x0 + boxSize, y0);
            gradWhite.addColorStop(0, 'rgba(255,255,255,1)');
            gradWhite.addColorStop(1, 'rgba(255,255,255,0)');
            ctx.fillStyle = gradWhite;
            ctx.fillRect(x0, y0, boxSize, boxSize);

            // 垂直方向：黒（明度 0%）グラデーション
            const gradBlack = ctx.createLinearGradient(x0, y0, x0, y0 + boxSize);
            gradBlack.addColorStop(0, 'rgba(0,0,0,0)');
            gradBlack.addColorStop(1, 'rgba(0,0,0,1)');
            ctx.fillStyle = gradBlack;
            ctx.fillRect(x0, y0, boxSize, boxSize);

            // 枠線
            ctx.strokeStyle = "#000000";
            ctx.lineWidth = 1;
            ctx.strokeRect(x0, y0, boxSize, boxSize);

            // C. 選択カーソルの描画
            // 色相リング上のポインター
            const ringAngle = currentHue * Math.PI / 180;
            const ringR = (outerRadius + innerRadius) / 2;
            const rx = center + ringR * Math.cos(ringAngle);
            const ry = center + ringR * Math.sin(ringAngle);
            ctx.beginPath();
            ctx.arc(rx, ry, 4, 0, Math.PI * 2);
            ctx.strokeStyle = "#ffffff";
            ctx.lineWidth = 2;
            ctx.stroke();
            ctx.strokeStyle = "#000000";
            ctx.lineWidth = 1;
            ctx.stroke();

            // SVボックス上のポインター
            const bx = x0 + (currentSat / 100) * boxSize;
            const by = y0 + (1 - currentVal / 100) * boxSize;
            ctx.beginPath();
            ctx.arc(bx, by, 5, 0, Math.PI * 2);
            ctx.strokeStyle = "#ffffff";
            ctx.lineWidth = 2;
            ctx.stroke();
            ctx.strokeStyle = "#000000";
            ctx.lineWidth = 1;
            ctx.stroke();
        }

        /* ピッカーのクリック・ドラッグ判定 */
        function handlePointer(e) {
            const rect = canvas.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;

            const dx = x - center;
            const dy = y - center;
            const dist = Math.sqrt(dx * dx + dy * dy);

            const x0 = center - boxSize / 2;
            const y0 = center - boxSize / 2;

            if (activeTarget === 'ring' || (!activeTarget && dist >= innerRadius && dist <= outerRadius)) {
                activeTarget = 'ring';
                let angle = Math.atan2(dy, dx) * (180 / Math.PI);
                if (angle < 0) angle += 360;
                currentHue = angle;
            } else if (activeTarget === 'box' || (!activeTarget && x >= x0 && x <= x0 + boxSize && y >= y0 && y <= y0 + boxSize)) {
                activeTarget = 'box';
                let sat = ((x - x0) / boxSize) * 100;
                let val = (1 - (y - y0) / boxSize) * 100;
                currentSat = Math.max(0, Math.min(100, sat));
                currentVal = Math.max(0, Math.min(100, val));
            }

            renderPicker();
            updateSelectedColor();
        }

        canvas.addEventListener("mousedown", (e) => {
            activeTarget = null;
            handlePointer(e);
        });
        canvas.addEventListener("mousemove", (e) => {
            if (e.buttons === 1) handlePointer(e);
        });
        document.addEventListener("mouseup", () => { activeTarget = null; });

        /* 選択中の色を更新 */
        function updateSelectedColor() {
            const rgb = hsvToRgb(currentHue, currentSat, currentVal);
            const hex = rgbToHex(rgb.r, rgb.g, rgb.b);

            if (selectedCell) {
                selectedCell.style.backgroundColor = hex;
                selectedCell.dataset.color = hex;
            }

            document.getElementById("val-hex").textContent = hex.toUpperCase();
            document.getElementById("val-rgb").textContent = `${rgb.r},${rgb.g},${rgb.b}`;
            document.getElementById("val-hsb").textContent = `${Math.round(currentHue)}°,${Math.round(currentSat)}%,${Math.round(currentVal)}%`;
        }

        /* HSV(HSB) -> RGB 変換 */
        function hsvToRgb(h, s, v) {
            s /= 100; v /= 100;
            let r, g, b;
            let i = Math.floor(h / 60) % 6;
            let f = h / 60 - Math.floor(h / 60);
            let p = v * (1 - s);
            let q = v * (1 - f * s);
            let t = v * (1 - (1 - f) * s);

            switch (i) {
                case 0: r = v; g = t; b = p; break;
                case 1: r = q; g = v; b = p; break;
                case 2: r = p; g = v; b = t; break;
                case 3: r = p; g = q; b = v; break;
                case 4: r = t; g = p; b = v; break;
                case 5: r = v; g = p; b = q; break;
            }
            return {
                r: Math.round(r * 255),
                g: Math.round(g * 255),
                b: Math.round(b * 255)
            };
        }

        function rgbToHex(r, g, b) {
            return "#" + [r, g, b].map(x => x.toString(16).padStart(2, '0')).join('');
        }

        // 初期描画
        updateImage();
        renderPicker();
        updateSelectedColor();
    </script>
</body>
</html>
